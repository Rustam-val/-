<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="SAVVA specialty coffee storefront at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2419"/><stop offset="1" stop-color="#3a4331"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4d2"/><stop offset="1" stop-color="#d9c9ae"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d9"/><stop offset="1" stop-color="#e8c98d"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a33"/><stop offset="1" stop-color="#5f3a1f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6b8"/><stop offset="1" stop-color="#a99e8e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd89a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd89a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#efe4d2"/>
  <rect x="0" y="0" width="1600" height="680" fill="url(#wall)"/>
  
  <rect x="0" y="660" width="1600" height="240" fill="url(#floor)"/>
  <g opacity=".25" stroke="#8d8273" stroke-width="2">
    <path d="M0 700h1600M0 760h1600M0 830h1600M200 660v240M520 660v240M900 660v240M1280 660v240"/>
  </g>

  <!-- warm wash from windows -->
  <ellipse cx="800" cy="640" rx="760" ry="220" fill="url(#glow)"/>

  <!-- storefront glazing -->
  <g>
    <rect x="150" y="300" width="500" height="360" rx="8" fill="url(#glass)"/>
    <rect x="700" y="300" width="240" height="360" rx="8" fill="url(#glass)"/>
    <rect x="990" y="300" width="420" height="360" rx="8" fill="url(#glass)"/>
    <g fill="none" stroke="url(#wood)" stroke-width="14">
      <rect x="150" y="300" width="500" height="360" rx="8"/>
      <rect x="700" y="300" width="240" height="360" rx="8"/>
      <rect x="990" y="300" width="420" height="360" rx="8"/>
    </g>
    <!-- arched doors -->
    <g fill="none" stroke="url(#wood)" stroke-width="16">
      <path d="M735 660V400a45 45 0 0 1 90 0v260"/>
      <path d="M1035 660V400a45 45 0 0 1 90 0v260"/>
    </g>
    <circle cx="838" cy="520" r="7" fill="#7a4d28"/>
    <circle cx="1138" cy="520" r="7" fill="#7a4d28"/>
  </g>

  <!-- interior silhouettes: shelves, machine, plants -->
  <g opacity=".55" fill="#8a6a3c">
    <rect x="190" y="350" width="150" height="12" rx="6"/>
    <rect x="190" y="410" width="150" height="12" rx="6"/>
    <rect x="190" y="470" width="150" height="12" rx="6"/>
    <g>
      <rect x="205" y="322" width="18" height="28" rx="4"/><rect x="232" y="322" width="18" height="28" rx="4"/>
      <rect x="259" y="322" width="18" height="28" rx="4"/><rect x="205" y="382" width="18" height="28" rx="4"/>
      <rect x="232" y="382" width="18" height="28" rx="4"/><rect x="259" y="382" width="18" height="28" rx="4"/>
    </g>
    <rect x="420" y="470" width="190" height="70" rx="10"/>
    <rect x="440" y="440" width="60" height="34" rx="8"/>
  </g>
  <g fill="#3e4b35" opacity=".7">
    <path d="M360 660c-6-70 10-120 28-150 4 44 12 104 6 150z"/>
    <path d="M388 640c26-34 62-44 88-42-22 18-40 40-52 62z"/>
    <path d="M372 636c-28-26-60-30-84-24 22 14 42 32 56 52z"/>
    <path d="M1230 660c-6-78 12-132 32-164 5 48 13 114 6 164z"/>
    <path d="M1262 636c28-38 68-48 96-46-24 20-44 44-56 68z"/>
  </g>


  <!-- terrace furniture -->
  <g fill="#2f3a2b">
    <g transform="translate(300,690)">
      <rect x="-70" y="-40" width="140" height="30" rx="14"/><rect x="-58" y="-92" width="116" height="58" rx="18"/>
      <rect x="-62" y="-10" width="12" height="58" rx="5"/><rect x="50" y="-10" width="12" height="58" rx="5"/>
    </g>
    <g transform="translate(1120,700)">
      <rect x="-70" y="-40" width="140" height="30" rx="14"/><rect x="-58" y="-92" width="116" height="58" rx="18"/>
      <rect x="-62" y="-10" width="12" height="58" rx="5"/><rect x="50" y="-10" width="12" height="58" rx="5"/>
    </g>
  </g>
  <g>
    <ellipse cx="710" cy="700" rx="140" ry="34" fill="#efe9df"/>
    <ellipse cx="710" cy="692" rx="140" ry="34" fill="#fbf7f0"/>
    <rect x="702" y="710" width="16" height="120" fill="#b9b0a2"/>
    <ellipse cx="710" cy="836" rx="60" ry="16" fill="#b9b0a2"/>
  </g>

  <rect width="1600" height="900" fill="#12160f" opacity=".10"/>
</svg>
